button.alt{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}

button.pink{background:var(--ac2)}

.av.s{width:46px;height:46px;font-size:24px;margin:0;flex:none}
.word{font-size:32px;font-weight:800;text-align:center;margin:4px 0 2px}
.show{text-align:center;color:var(--mu);font-size:13px;margin-bottom:14px}

.vlist{display:grid;gap:8px}

const X=[

["cartoon","😡","Gian,Kalia,Suneo"],["cartoon","🐾","Doraemon,Pikachu"],["cartoon","🧒","Shinchan,Hagemaru"],["cartoon","😴","Nobita,Kenichi"],["cartoon","🍖","Motu,Bheem,Dholu"],["cartoon","🤓","Patlu,Dekisugi,Kazama"],["cartoon","👿","John the Don,Dr Jhatka,Vilgax,Kemumaki"],["cartoon","👧","Chutki,Shizuka,Gwen,Misty"],["cartoon","😏","Suneo,Gary,Kevin"],
["mixed","🐾","Pikachu,Chopper,Doraemon"],["mixed","🍖","Luffy,Goku,Motu,Bheem"],["mixed","😤","Vegeta,Sasuke,Gary"],["mixed","🥷","Naruto,Hattori"]
];
const LK={};D.forEach(g=>g.slice(3).forEach(e=>{const n=e.split('|')[0];if(!LK[n])LK[n]=e}));
const CATS=[["anime","Anime","Naruto, DBZ, AoT…"],["cartoon","Cartoons","Doraemon, Bheem…"],["things","Things","Milk, pen, bus…"],["mixed","Mixed","Everything together"]];
const app=document.getElementById('app');
let S={n:5,names:[],cat:'mixed',odd:1,x:1};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function clr(){app.replaceChildren();window.scrollTo(0,0)}
function shuf(a){return a.slice().sort(()=>Math.random()-.5)}
function nm(k){return (S.names[k]||'').trim()||('Player '+(k+1))}
function av(e,s,seed){const a=el('div','av'+(s?' s':''),e);const h=[...seed].reduce((x,c)=>x+c.charCodeAt(0),0)%360;a.style.background='linear-gradient(135deg,hsl('+h+',80%,70%),hsl('+(h+50)+',80%,60%))';return a}
function hero(){const h=el('div','hero');h.append(el('h1',0,'🕵️ Odd One Out'),el('p',0,'Pass the phone. Find the player with the different character.'));app.append(h)}
function setup(){
 clr();hero();
 let c=el('div','card');c.append(el('span','t','Players'));
 const r=el('div','row'),m=el('button','sm alt','−'),p=el('button','sm alt','+');
 m.onclick=()=>{if(S.n>3){S.n--;setup()}};p.onclick=()=>{if(S.n<12){S.n++;setup()}};
 r.append(m,el('div','cnt',S.n),p);c.append(r);app.append(c);
 c=el('div','card');c.append(el('span','t','Names (optional)'));
 for(let k=0;k<S.n;k++){const i=el('input');i.placeholder='Player '+(k+1);i.maxLength=14;i.value=S.names[k]||'';i.oninput=()=>S.names[k]=i.value;c.append(i)}
 app.append(c);
 c=el('div','card');c.append(el('span','t','Category (same for all)'));
 const g=el('div','g2');
 CATS.forEach(([k,a,b])=>{const x=el('button','alt'+(S.cat==k?' sel':''),a);x.append(el('small',0,b));x.onclick=()=>{S.cat=k;setup()};g.append(x)});
 c.append(g);app.append(c);
 if(S.n<5)S.odd=1;
 c=el('div','card');c.append(el('span','t','Odd players'));
 const q=el('div','row');[1,2].forEach(v=>{const x=el('button','alt'+(S.odd==v?' sel':''),v==2&&S.n<5?'2 (needs 5+)':v+' odd');x.onclick=()=>{if(v==2&&S.n<5)return;S.odd=v;setup()};q.append(x)});
 c.append(q);app.append(c);
 c=el('div','card');c.append(el('span','t','Cross-show odd one'));
 const xr=el('div','row');[[1,'On'],[0,'Off']].forEach(([v,l])=>{const x=el('button','alt'+(S.x==v?' sel':''),l);x.onclick=()=>{S.x=v;setup()};xr.append(x)});
 c.append(xr,el('p','note','On: odd one can get the most similar character from another show. Off: same show only.'));app.append(c);
 const go=el('button',0,'▶ Start Game');go.onclick=start;app.append(go);
}
function start(){
 const cl=S.x?X.filter(c=>S.cat=='mixed'||c[0]==S.cat):[];
 const nm0=S.cat=='mixed'?D.filter(g=>g[0]=='things'):D.filter(g=>g[0]==S.cat);
 const pool=cl.length?cl.concat(S.cat=='mixed'?nm0:[]):(S.cat=='mixed'?D:nm0);
 const g=pool[Math.floor(Math.random()*pool.length)];
 let a,b;
 if(typeof g[2]=='string'&&g.length==3){
  const [x,y]=shuf(g[2].split(',')).slice(0,2);a=LK[x].split('|');b=LK[y].split('|');S.g=[g[0],g[1],'Cross-show round'];
 }else{
  const it=g.slice(3),q=it.length>3?2*Math.floor(Math.random()*Math.floor(it.length/2)):Math.floor(Math.random()*(it.length-1));
  [a,b]=shuf([it[q],it[q+1]]).map(s=>s.split('|'));S.g=g;
 }
 S.real=a;S.oddc=b;
 S.oddi=shuf([...Array(S.n).keys()]).slice(0,S.odd);
 S.words=[...Array(S.n).keys()].map(k=>S.oddi.includes(k)?b:a);
 S.i=0;S.first=Math.floor(Math.random()*S.n);S.votes=[];S.vi=0;
 cover();
}
function cover(){
 clr();
 const c=el('div','card big');
 c.append(av('🙈',0,nm(S.i)),el('h2',0,nm(S.i)),el('p','sub','Only you should look. Play dabao apna character dekhne ke liye.'));
 const b=el('button',0,'Play');b.onclick=reveal1;c.append(b);
 app.append(el('p','note','Player '+(S.i+1)+' of '+S.n),c);
}
function reveal1(){
 clr();
 const w=S.words[S.i],c=el('div','card');
 c.append(av(w[0][0],0,w[0]),el('div','word',w[0]),el('div','show',S.g[2]),el('span','t','Tumhare clues'));
 w.slice(1).forEach(h=>c.append(el('div','clue',h)));
 app.append(c);
 const b=el('button',0,'✔ Done');b.onclick=()=>{S.i++;S.i<S.n?cover():talk()};app.append(b);
}
function talk(){
 clr();
 const c=el('div','card big');
 c.append(av('💬',0,'talk'),el('h2',0,'Discuss!'),el('p','sub',nm(S.first)+' starts. Each player gives one clue about their character without saying the name. Then vote.'));
 const b=el('button','pink','🗳️ Start Voting');b.onclick=()=>{S.vi=0;S.votes=[];vcover()};c.append(b);app.append(c);
}
function vcover(){
 clr();
 const c=el('div','card big');
 c.append(av('🗳️',0,nm(S.vi)),el('h2',0,nm(S.vi)),el('p','sub','Your turn to vote. Tap Vote when you are holding the phone.'));
 const b=el('button',0,'Vote');b.onclick=vpick;c.append(b);
 app.append(el('p','note','Vote '+(S.vi+1)+' of '+S.n),c);
}
function vpick(){
 clr();
 const c=el('div','card');c.append(el('span','t','Who is the odd one?'));
 const l=el('div','vlist');
 for(let k=0;k<S.n;k++){if(k==S.vi)continue;
  const b=el('button','alt');b.append(av(['🦊','🐼','🐯','🐸','🦁','🐵','🐙','🦄','🐧','🐲','🦉','🐰'][k],1,nm(k)),el('span',0,nm(k)));
  b.onclick=()=>{S.votes.push(k);S.vi++;S.vi<S.n?vcover():results()};l.append(b)}
 c.append(l);app.append(c);
}
function results(){
 clr();
 const t=Array(S.n).fill(0);S.votes.forEach(v=>t[v]++);
 const mx=Math.max(...t),top=t.map((v,k)=>v==mx?k:-1).filter(k=>k>=0);
 const caught=top.length==1&&S.oddi.includes(top[0]);
 let c=el('div','card res');
 c.append(el('div','w '+(caught?'ok':'bad'),caught?'🎉 Pakda gaya Mc!':'😈 Chutiya kaat diya sabka!'));
 const ob=el('div','oddbox');ob.append(el('small',0,'🕵️ Odd '+(S.oddi.length>1?'players':'player')),el('b',0,S.oddi.map(nm).join(' & ')));c.append(ob);c.append(el('span','t','Vote results'));
 t.forEach((v,k)=>{const r=el('div');r.style.textAlign='left';r.style.marginBottom='8px';r.append(el('div',0,nm(k)+' — '+v+(v==1?' vote':' votes')));const b=el('div','bar');b.style.width=(mx?v/mx*100:0)+'%';r.append(b);c.append(r)});
 app.append(c);
 c=el('div','card res');
 c.append(av(S.real[0][0],0,S.real[0]),el('span','t','Everyone else had'),el('div','w',S.real[0]),el('span','t','Odd '+(S.oddi.length>1?'players':'player')+' had'),el('div','w',S.oddc[0]),(()=>{const o=el('div','oddbox');o.append(el('small',0,'🕵️ Odd '+(S.oddi.length>1?'players':'player')),el('b',0,S.oddi.map(nm).join(' & ')));return o})());
 app.append(c);
 const a=el('button',0,'🔁 Play Again');a.onclick=start;
 const s=el('button','alt','⚙️ Settings');s.style.marginTop='8px';s.onclick=setup;app.append(a,s);
}
setup();
